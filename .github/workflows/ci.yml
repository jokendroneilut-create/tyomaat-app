name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install (ei npm ci): Windowsilla generoitu package-lock ei sisällä
      # kaikkia Linuxin optionaalisia alustapaketteja, joten tiukka npm ci
      # kaatuu Linux-runnerilla. npm install hakee oikeat binäärit itse.
      - run: npm install --no-audit --no-fund
      - run: npm test
